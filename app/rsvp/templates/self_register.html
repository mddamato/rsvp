{% extends "base.html" %}
{% block content %}
<p class="lede">Tell us who's coming so we can send your personal invitation.</p>
{% if error %}<p class="notice">{{ error }}</p>{% endif %}
<form method="post" action="/self-register">
  <input type="text" name="honeypot" class="hp" tabindex="-1" autocomplete="off" aria-hidden="true">
  <label for="primary_name">Name</label>
  <input type="text" id="primary_name" name="primary_name" required>
  <label for="email">Email (optional, so we can send your link)</label>
  <input type="email" id="email" name="email">
  <label for="max_guests">Additional guests you'll bring</label>
  <input type="number" id="max_guests" name="max_guests" min="0" max="20" value="0">
  <button type="submit" data-once>Get my invitation</button>
</form>
{% endblock %}
